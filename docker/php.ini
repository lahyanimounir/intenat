; Réglages PHP de l'image INTERNAT.

expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

date.timezone = Africa/Casablanca
memory_limit = 256M

; Pièces et reçus : 5 Mo au plus (INTERNAT_TAILLE_MAX_KO), avec une marge pour l'enveloppe multipart.
upload_max_filesize = 6M
post_max_size = 8M
max_file_uploads = 5

; Cookies de session : jamais lisibles par un script.
session.cookie_httponly = 1
session.use_strict_mode = 1

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Le code de l'image ne change pas après construction.
opcache.validate_timestamps = 0
